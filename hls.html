<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>HLS Player</title>
	<style>
		html,body { height:100%; margin:0; background:#000; }
		#player { width:100%; height:100%; display:block; background:#000; }
	</style>
</head>
<body>
	<video id="player" playsinline controls></video>
	<script src="https://unpkg.com/hls.js@1.5.7/dist/hls.min.js"></script>
	<script>
		(function(){
			const params = new URLSearchParams(location.search);
			const src = params.get('src');
			const autoplay = params.get('autoplay') !== null; // add &autoplay to auto-play
			const video = document.getElementById('player');
			if (!src){
				video.poster = '';
				return;
			}
			if (video.canPlayType('application/vnd.apple.mpegURL')){
				video.src = src;
				if (autoplay) video.play().catch(()=>{});
			} else if (window.Hls && Hls.isSupported()){
				const hls = new Hls({lowLatencyMode:false});
				hls.loadSource(src);
				hls.attachMedia(video);
				hls.on(Hls.Events.MANIFEST_PARSED, function(){ if (autoplay) video.play().catch(()=>{}); });
			} else {
				video.outerHTML = '<div style="color:#fff;font-family:system-ui;padding:16px;">HLS not supported</div>';
			}
		})();
	</script>
</body>
</html>
