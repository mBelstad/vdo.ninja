version: "3.8"

services:
  vdoninja:
    image: caddy:alpine@sha256:a4180db0805b3725ddf936d2e6290553745c7339c003565da717ee612fd8a888
    volumes:
      - ./deploy/coolify/Caddyfile.vdoninja:/etc/caddy/Caddyfile:ro
      - ./:/usr/share/caddy:ro
    expose:
      - "80"
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    volumes:
      - ./deploy/coolify/mediamtx.yml:/mediamtx.yml:ro
      - mediamtx-recordings:/recordings
    expose:
      - "8888"
    ports:
      - "8890:8890/udp"           # SRT ingest
      - "20000-20099:20000-20099/udp"  # WebRTC ICE UDP range
    restart: unless-stopped

  coturn:
    image: instrumentisto/coturn:latest
    container_name: coturn
    volumes:
      - ./deploy/coolify/turnserver.conf.sample:/etc/turnserver.conf:ro
    ports:
      - "3478:3478/udp"           # STUN/TURN (UDP)
    restart: unless-stopped

volumes:
  mediamtx-recordings:


