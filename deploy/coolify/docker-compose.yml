version: "3.8"

services:
  vdoninja:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.vdoninja
    expose:
      - "80"
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - coolify

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    volumes:
      - ./deploy/coolify/mediamtx-config.yml:/config/mediamtx.yml:ro
      - mediamtx-recordings:/recordings
    command: ["/config/mediamtx.yml"]
    expose:
      - "8888"
    ports:
      - "8088:8888"
      - "8890:8890/udp"           # SRT ingest
      - "20000-20099:20000-20099/udp"  # WebRTC ICE UDP range
    restart: unless-stopped
    networks:
      - coolify

  coturn:
    image: instrumentisto/coturn:latest
    container_name: coturn
    volumes:
      - ./deploy/coolify/turnserver.conf.sample:/etc/turnserver.conf:ro
    ports:
      - "3478:3478/udp"           # STUN/TURN (UDP)
    restart: unless-stopped

volumes:
  mediamtx-recordings:


networks:
  coolify:
    external: true
